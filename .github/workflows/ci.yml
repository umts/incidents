name: ci
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
    env:
      RAILS_ENV: test
      DATABASE_URL: trilogy://root@127.0.0.1:3306/incidents_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bin/setup --skip-server
      - run: bundle exec rspec
      - name: Archive failed system test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-screenshots
          path: tmp/capybara/*.png
          if-no-files-found: ignore
  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bundle exec brakeman --no-pager
